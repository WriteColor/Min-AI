<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MIN Neural Core 3D</title>
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700&family=Sora:wght@600;700;800&family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200&display=swap" rel="stylesheet"/>
    <style>
        :root {
            --pri:     #b06cff;
            --pri-alt: #8b5cf6;
            --glow:    rgba(176,108,255,0.38);
            --glow2:   rgba(139,92,246,0.22);
        }
        * { box-sizing:border-box; margin:0; padding:0; }

        body {
            background: transparent;
            overflow: hidden;
            font-family: 'JetBrains Mono', monospace;
            user-select: none;
        }

        #neural-core-container {
            width:100vw; height:100vh;
            position:relative;
            display:flex; align-items:center; justify-content:center;
        }

        #orb-wrapper {
            position:absolute; top:0; left:0;
            width:100%; height:100%;
            display:flex; align-items:center; justify-content:center;
            z-index:10;
        }

        #three-canvas {
            position:absolute; top:0; left:0;
            width:100% !important; height:100% !important;
            z-index:10; cursor:grab;
            filter: drop-shadow(0 0 42px var(--glow)) drop-shadow(0 0 20px var(--glow2));
            transition: filter 0.5s ease;
        }
        #three-canvas:active { cursor:grabbing; }


        .ripple {
            position:absolute; border-radius:50%; pointer-events:none;
            animation: ripple-out 1.5s cubic-bezier(0.165,0.84,0.44,1) forwards;
            z-index:5; border:1px solid var(--pri);
        }
        @keyframes ripple-out {
            0%   { width:0;height:0;opacity:1;transform:translate(-50%,-50%) scale(1); }
            100% { width:100vw;height:100vw;opacity:0;border-width:0;transform:translate(-50%,-50%) scale(1.5); }
        }

        .data-particle {
            position:absolute; width:3px;height:3px; border-radius:50%;
            pointer-events:none; filter:blur(0.5px); z-index:15;
        }

        /* Hidden elements kept for Python API compat */
        #synaptic-stats { display:none; }
        #bottom-mic-panel { display:none !important; }
        .mic-capsule,.mic-label,.mic-halo { display:none; }

    </style>
</head>
<body>
<div id="neural-core-container">

    <div id="orb-wrapper">
        <canvas id="three-canvas"></canvas>
    </div>

    <!-- Hidden mic panel – Python API compat -->
    <div id="bottom-mic-panel">
        <div class="mic-capsule" id="mic-capsule-border">
            <button id="lbl-mic-on"    class="mic-label" onclick="setMuteFromWeb(false)"></button>
            <div style="position:relative;width:74px;height:74px;display:flex;align-items:center;justify-content:center;">
                <div class="mic-halo" id="ring-1"></div>
                <div class="mic-halo" id="ring-2"></div>
                <button id="mic-trigger" onclick="onMicTriggerClick()">
                    <span id="mic-icon" style="display:none;"></span>
                </button>
            </div>
            <button id="lbl-mic-muted" class="mic-label" onclick="setMuteFromWeb(true)"></button>
        </div>
    </div>

    <!-- Hidden stats – Python API compat -->
    <div id="synaptic-stats">
        <span id="stat-sync"></span>
        <span id="stat-load"></span>
    </div>
</div>

<script src="qrc:///qtwebchannel/qwebchannel.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
// ── Qt WebChannel ─────────────────────────────────────────────────────────────
let pyBridge = null;
try {
    new QWebChannel(qt.webChannelTransport, function(ch){
        pyBridge = ch.objects.pyBridge;
        console.log("Qt WebChannel connected!");
        if(pyBridge && pyBridge.request_theme) pyBridge.request_theme();
    });
} catch(e){ console.log("Standalone mode."); }

// ── State ────────────────────────────────────────────────────────────────────
let isMuted       = false;
let baseIntensity = 1.0;
let currentState  = "LISTENING";
let currentVolume = 0.0;
let smoothedVolume = 0.0;
let _nodePoints   = null; // ref set after Three.js Points object is created

// ── Palettes — purple gradient family, one shade per state ───────────────────
// LISTENING : soft vibrant purple   — active, receptive
// THINKING  : deep indigo-violet    — cognitive, introspective
// SPEAKING  : hot purple-magenta    — expressive, energetic
// MUTED     : dim muted violet      — dormant, subdued
const PALETTES = {
    LISTENING:{ PRI:'#a855f7', PRI_DIM:'#4c1d95', TEXT:'#e9d5ff', BG:'#07020f', ALT:'#818cf8' },
    THINKING: { PRI:'#7c3aed', PRI_DIM:'#3b0764', TEXT:'#ddd6fe', BG:'#050210', ALT:'#a78bfa' },
    SPEAKING: { PRI:'#c026d3', PRI_DIM:'#701a75', TEXT:'#f0abfc', BG:'#080010', ALT:'#e879f9' },
    MUTED:    { PRI:'#6b21a8', PRI_DIM:'#2e1065', TEXT:'#c4b5fd', BG:'#050208', ALT:'#7c3aed' },
};

let themeColors  = { ...PALETTES.LISTENING };
let targetPalette= { ...PALETTES.LISTENING };
let lerpColors   = { ...PALETTES.LISTENING };
let lerpT        = 1.0;

// DOM refs (API compat)
const micBtn        = document.getElementById('mic-trigger');
const micIconEl     = document.getElementById('mic-icon');
const ring1El       = document.getElementById('ring-1');
const ring2El       = document.getElementById('ring-2');
const lblOnEl       = document.getElementById('lbl-mic-on');
const lblMutedEl    = document.getElementById('lbl-mic-muted');
const capsuleBorder = document.getElementById('mic-capsule-border');

// ── Helpers ───────────────────────────────────────────────────────────────────
function hexToRgba(hex, a){
    if(/^#([A-Fa-f0-9]{3}){1,2}$/.test(hex)){
        let c=hex.substring(1).split('');
        if(c.length===3)c=[c[0],c[0],c[1],c[1],c[2],c[2]];
        c='0x'+c.join('');
        return `rgba(${[(c>>16)&255,(c>>8)&255,c&255].join(',')},${a})`;
    }
    return hex;
}
function lerpHex(a,b,t){
    const ca=new THREE.Color(a),cb=new THREE.Color(b);
    const r=ca.r+(cb.r-ca.r)*t, g=ca.g+(cb.g-ca.g)*t, bl=ca.b+(cb.b-ca.b)*t;
    return '#'+new THREE.Color(r,g,bl).getHexString();
}

// ── Three.js ──────────────────────────────────────────────────────────────────
const canvas     = document.getElementById('three-canvas');
const orbWrapper = document.getElementById('orb-wrapper');

const renderer = new THREE.WebGLRenderer({canvas, antialias:true, alpha:true, powerPreference:"high-performance"});
renderer.setPixelRatio(window.devicePixelRatio);
renderer.setClearColor(0x000000, 0);

const scene  = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(45,1,0.1,1000);
camera.position.z = 5;

const group = new THREE.Group();
scene.add(group);

// 1. Solid icosahedron core
const coreGeo  = new THREE.IcosahedronGeometry(0.72, 1);
const coreMat  = new THREE.MeshPhongMaterial({
    color:0x000000, emissive:new THREE.Color(themeColors.PRI),
    emissiveIntensity:0.55, shininess:130,
    transparent:true, opacity:0.90,
});
group.add(new THREE.Mesh(coreGeo, coreMat));

const coreWireMat = new THREE.MeshBasicMaterial({
    color:new THREE.Color(themeColors.PRI),
    wireframe:true, transparent:true, opacity:0.09,
});
group.add(new THREE.Mesh(coreGeo, coreWireMat));

// 2. Mid octahedron cage
const midGeo = new THREE.OctahedronGeometry(1.08, 2);
const midMat = new THREE.MeshBasicMaterial({
    color:new THREE.Color(themeColors.PRI),
    wireframe:true, transparent:true, opacity:0.18,
});
group.add(new THREE.Mesh(midGeo, midMat));

// 3. Outer icosahedron shell
const outerGeo = new THREE.IcosahedronGeometry(1.42, 2);
const outerMat = new THREE.MeshBasicMaterial({
    color:new THREE.Color(themeColors.ALT),
    wireframe:true, transparent:true, opacity:0.09,
});
group.add(new THREE.Mesh(outerGeo, outerMat));

// 4. Equatorial torus
const ringGeo  = new THREE.TorusGeometry(1.28,0.012,8,96);
const ringMat  = new THREE.MeshBasicMaterial({color:new THREE.Color(themeColors.PRI),transparent:true,opacity:0.55});
const ringMesh = new THREE.Mesh(ringGeo, ringMat);
ringMesh.rotation.x = Math.PI/2;
group.add(ringMesh);

// 5. Second tilted ring
const ring2Geo  = new THREE.TorusGeometry(1.38,0.008,8,96);
const ring2Mat  = new THREE.MeshBasicMaterial({color:new THREE.Color(themeColors.ALT),transparent:true,opacity:0.30});
const ring2Mesh = new THREE.Mesh(ring2Geo, ring2Mat);
ring2Mesh.rotation.x = Math.PI/3;
ring2Mesh.rotation.y = Math.PI/5;
group.add(ring2Mesh);

// 6. Node particles (Fibonacci sphere)
const NODE_COUNT=90;
const nPos=[],nSizes=[];
for(let i=0;i<NODE_COUNT;i++){
    const phi=Math.acos(1-2*(i+0.5)/NODE_COUNT);
    const theta=Math.PI*(1+Math.sqrt(5))*i;
    const r=1.05+(Math.random()-0.5)*0.25;
    nPos.push(r*Math.sin(phi)*Math.cos(theta),r*Math.sin(phi)*Math.sin(theta),r*Math.cos(phi));
    nSizes.push(0.018+Math.random()*0.028);
}
const nodeGeo=new THREE.BufferGeometry();
nodeGeo.setAttribute('position',new THREE.Float32BufferAttribute(nPos,3));
nodeGeo.setAttribute('size',    new THREE.Float32BufferAttribute(nSizes,1));

const nodeVert=`
    attribute float size;
    varying float vDepth;
    varying vec3 vPos;
    void main(){
        vec4 mv=modelViewMatrix*vec4(position,1.0);
        vDepth=clamp((-mv.z+3.0)/6.0,0.0,1.0);
        vPos=position;
        gl_PointSize=size*220.0*vDepth;
        gl_Position=projectionMatrix*mv;
    }
`;
const nodeFrag=`
    uniform vec3  uColorA;
    uniform vec3  uColorB;
    uniform float uOpacity;
    varying float vDepth;
    varying vec3  vPos;
    void main(){
        float d=distance(gl_PointCoord,vec2(0.5));
        if(d>0.5) discard;
        float t=clamp((vPos.y+1.5)/3.0,0.0,1.0);
        vec3 col=mix(uColorA,uColorB,t);
        float alpha=(1.0-d*2.0)*vDepth*uOpacity;
        gl_FragColor=vec4(col,alpha);
    }
`;
const nodeMat=new THREE.ShaderMaterial({
    uniforms:{
        uColorA:{value:new THREE.Color(themeColors.PRI)},
        uColorB:{value:new THREE.Color(themeColors.ALT)},
        uOpacity:{value:0.9},
    },
    vertexShader:nodeVert, fragmentShader:nodeFrag,
    transparent:true, depthWrite:false,
});
const nodePoints = new THREE.Points(nodeGeo, nodeMat);
group.add(nodePoints);
_nodePoints = nodePoints; // expose for triggerRipple synaptic burst

// 7. Neural connections (nearest neighbors)
const CONNECTIONS_PER_NODE = 3;
const linePositions = [];
for (let i = 0; i < NODE_COUNT; i++) {
    const ix = nPos[i * 3];
    const iy = nPos[i * 3 + 1];
    const iz = nPos[i * 3 + 2];
    const neighbors = [];
    for (let j = 0; j < NODE_COUNT; j++) {
        if (i === j) continue;
        const jx = nPos[j * 3];
        const jy = nPos[j * 3 + 1];
        const jz = nPos[j * 3 + 2];
        const dx = ix - jx;
        const dy = iy - jy;
        const dz = iz - jz;
        neighbors.push({ idx: j, dist: dx * dx + dy * dy + dz * dz });
    }
    neighbors.sort((a, b) => a.dist - b.dist);
    for (let k = 0; k < Math.min(CONNECTIONS_PER_NODE, neighbors.length); k++) {
        const j = neighbors[k].idx;
        if (j <= i) continue;
        const jx = nPos[j * 3];
        const jy = nPos[j * 3 + 1];
        const jz = nPos[j * 3 + 2];
        linePositions.push(ix, iy, iz, jx, jy, jz);
    }
}
const lineGeo = new THREE.BufferGeometry();
lineGeo.setAttribute('position', new THREE.Float32BufferAttribute(linePositions, 3));
const lineMat = new THREE.LineBasicMaterial({
    color: new THREE.Color(themeColors.PRI),
    transparent: true,
    opacity: 0.18,
});
const lineMesh = new THREE.LineSegments(lineGeo, lineMat);
group.add(lineMesh);

// Lighting
const ambientLight = new THREE.AmbientLight(0xffffff,0.12); scene.add(ambientLight);
const pointLight   = new THREE.PointLight(new THREE.Color(themeColors.PRI),2.5,10);
pointLight.position.set(2,2,3); scene.add(pointLight);
const rimLight     = new THREE.PointLight(new THREE.Color(themeColors.PRI_DIM),1.2,10);
rimLight.position.set(-3,-1,-2); scene.add(rimLight);

// ── Resize ────────────────────────────────────────────────────────────────────
function resizeRenderer(){
    const w=orbWrapper.clientWidth, h=orbWrapper.clientHeight;
    renderer.setSize(w,h,false);
    camera.aspect=w/h; camera.updateProjectionMatrix();
}
resizeRenderer();
if (window.ResizeObserver) {
    const ro = new ResizeObserver(() => resizeRenderer());
    ro.observe(orbWrapper);
}
setTimeout(resizeRenderer, 120);
window.addEventListener('resize',resizeRenderer);

// ── Drag-to-rotate ────────────────────────────────────────────────────────────
let isDragging=false, prevMouse={x:0,y:0}, userRotX=0, userRotY=0;
canvas.addEventListener('mousedown',e=>{isDragging=true;prevMouse={x:e.clientX,y:e.clientY};canvas.style.cursor='grabbing';});
window.addEventListener('mousemove',e=>{
    if(!isDragging)return;
    userRotY+=(e.clientX-prevMouse.x)*0.012;
    userRotX+=(e.clientY-prevMouse.y)*0.012;
    prevMouse={x:e.clientX,y:e.clientY};
});
window.addEventListener('mouseup',()=>{isDragging=false;canvas.style.cursor='grab';});
canvas.addEventListener('touchstart',e=>{isDragging=true;prevMouse={x:e.touches[0].clientX,y:e.touches[0].clientY};},{passive:true});
canvas.addEventListener('touchmove',e=>{
    if(!isDragging)return;
    userRotY+=(e.touches[0].clientX-prevMouse.x)*0.012;
    userRotX+=(e.touches[0].clientY-prevMouse.y)*0.012;
    prevMouse={x:e.touches[0].clientX,y:e.touches[0].clientY};
},{passive:true});
canvas.addEventListener('touchend',()=>{isDragging=false;});

// ── Palette apply ─────────────────────────────────────────────────────────────
function applyColors(c){
    coreMat.emissive.set(c.PRI);
    coreWireMat.color.set(c.PRI);
    midMat.color.set(c.PRI);
    outerMat.color.set(c.ALT);
    ringMat.color.set(c.PRI);
    ring2Mat.color.set(c.ALT);
    nodeMat.uniforms.uColorA.value.set(c.PRI);
    nodeMat.uniforms.uColorB.value.set(c.ALT);
    lineMat.color.set(c.PRI);
    pointLight.color.set(c.PRI);
    rimLight.color.set(c.PRI_DIM);

    const root=document.documentElement;
    root.style.setProperty('--pri', c.PRI);
    root.style.setProperty('--pri-alt', c.ALT);
    root.style.setProperty('--glow',  hexToRgba(c.PRI,0.38));
    root.style.setProperty('--glow2', hexToRgba(c.ALT,0.22));
    canvas.style.filter=`drop-shadow(0 0 42px ${hexToRgba(c.PRI,0.5)}) drop-shadow(0 0 20px ${hexToRgba(c.ALT,0.28)})`;

    themeColors.PRI=c.PRI; themeColors.ALT=c.ALT;
    themeColors.PRI_DIM=c.PRI_DIM; themeColors.TEXT=c.TEXT;
}
function switchPalette(state){
    targetPalette={...PALETTES[state]||PALETTES.LISTENING};
    lerpT=0;
}

// ── Speaking scale engine ─────────────────────────────────────────────────────
// Smoothly follows voice volume with exponential smoothing — no impulses, no stutter.
let bouncePos  = 1.0;  // kept for API compat (reset on state switch)
let bounceVel  = 0;    // kept for API compat
let prevVolume = 0.0;  // kept for API compat
let _volFollow = 0.0;  // internal slow-follower for scale

function updateBounce(dt){
    if(currentState==="SPEAKING"){
        // Attack fast, release slow → volume spikes don't pop, silence decays gently
        const attack  = 1.0 - Math.exp(-dt * 8.0);   // ~120 ms
        const release = 1.0 - Math.exp(-dt * 2.5);   // ~400 ms
        const alpha   = currentVolume > _volFollow ? attack : release;
        _volFollow   += (currentVolume - _volFollow) * alpha;
        // Gentle expansion: max +8% at full volume
        const target  = 1.0 + _volFollow * 0.08;
        bouncePos    += (target - bouncePos) * (1.0 - Math.exp(-dt * 10.0));
    } else {
        // Decay back to 1.0
        _volFollow += (0 - _volFollow) * (1.0 - Math.exp(-dt * 4.0));
        bouncePos  += (1.0 - bouncePos) * (1.0 - Math.exp(-dt * 6.0));
    }
    bouncePos = Math.max(0.97, Math.min(1.08, bouncePos));
    return bouncePos;
}

// ── Ripple & particles ────────────────────────────────────────────────────────
function triggerRipple(){
    const el=document.createElement('div');
    el.className='ripple';
    el.style.left=el.style.top='50%';
    el.style.borderColor=themeColors.PRI;
    orbWrapper.appendChild(el);
    setTimeout(()=>el.remove(),1500);
    // Synaptic burst on nodes (mirrors original: fire ~40% of nodes)
    if(_nodePoints){
        const sizes=_nodePoints.geometry.attributes.size.array;
        for(let i=0;i<sizes.length;i++){
            if(Math.random()>0.6) sizes[i]=0.09; // flare up
        }
        _nodePoints.geometry.attributes.size.needsUpdate=true;
        setTimeout(()=>{
            if(!_nodePoints) return;
            const s2=_nodePoints.geometry.attributes.size.array;
            for(let i=0;i<s2.length;i++) s2[i]=nSizes[i]; // restore
            _nodePoints.geometry.attributes.size.needsUpdate=true;
        },220);
    }
}
function createFloatingParticle(){
    const p=document.createElement('div');
    p.className='data-particle';
    const w=orbWrapper.clientWidth,h=orbWrapper.clientHeight,r=Math.min(w,h)*0.38;
    p.style.left=(w/2+(Math.random()-0.5)*r*1.8)+'px';
    p.style.top =(h/2+(Math.random()-0.5)*r*1.8)+'px';
    p.style.background=themeColors.PRI;
    p.style.boxShadow=`0 0 6px ${themeColors.PRI},0 0 12px ${themeColors.ALT}`;
    orbWrapper.appendChild(p);
    const dur=1200+Math.random()*2000;
    const anim=p.animate([
        {transform:'translate(0,0) scale(1)',opacity:0},
        {transform:`translate(${(Math.random()-0.5)*100}px,-80px) scale(1.4)`,opacity:0.85,offset:0.5},
        {transform:`translate(${(Math.random()-0.5)*200}px,-180px) scale(0)`,opacity:0}
    ],{duration:dur,easing:'ease-out'});
    anim.onfinish=()=>p.remove();
}

// ── Auto-rotation speeds ──────────────────────────────────────────────────────
const autoSpeeds={
    LISTENING:{y:0.0032, x:0.0012},
    THINKING: {y:0.007,  x:0.0022},
    SPEAKING: {y:0.0024, x:0.0008},
    MUTED:    {y:0.0003, x:0.00008},
};
let autoRotY=0, autoRotX=0;
const clock=new THREE.Clock();
let lastTime=0;

// ── Main loop ─────────────────────────────────────────────────────────────────
function animate(){
    requestAnimationFrame(animate);
    const t  =clock.getElapsedTime();
    const dt =Math.min(t-lastTime, 0.05);
    lastTime =t;
    const spd=autoSpeeds[currentState]||autoSpeeds.LISTENING;

    autoRotY+=spd.y; autoRotX+=spd.x;
    group.rotation.y=autoRotY+userRotY;
    group.rotation.x=autoRotX+userRotX;

    // Palette lerp (~40 frames)
    if(lerpT<1){
        lerpT=Math.min(1,lerpT+0.028);
        const s=0.028;
        lerpColors.PRI    =lerpHex(lerpColors.PRI,    targetPalette.PRI,    s);
        lerpColors.PRI_DIM=lerpHex(lerpColors.PRI_DIM,targetPalette.PRI_DIM,s);
        lerpColors.TEXT   =lerpHex(lerpColors.TEXT,   targetPalette.TEXT,   s);
        lerpColors.ALT    =lerpHex(lerpColors.ALT,    targetPalette.ALT,    s);
        applyColors(lerpColors);
    }

    // State visuals
    let scaleTarget=1.0, coreEmissive=0.55;

    if(currentState==="MUTED"){
        coreEmissive=0.15;
        midMat.opacity=0.06; outerMat.opacity=0.03;
        nodeMat.uniforms.uOpacity.value=0.28;
        pointLight.intensity=0.5;
        scaleTarget=0.95;

    } else if(currentState==="THINKING"){
        // Layered pulses: slow base + fast micro-oscillation → nervous energy
        const tp1=Math.sin(t*3.8), tp2=Math.sin(t*11.0)*0.4;
        scaleTarget=1.025 + tp1*0.030 + tp2*0.008;
        coreEmissive=1.0 + tp1*0.12;        // stronger peak glow
        midMat.opacity=0.44+Math.sin(t*5.0)*0.06;
        outerMat.opacity=0.26+Math.sin(t*7.0)*0.05;
        nodeMat.uniforms.uOpacity.value=1.20+tp2*0.08;
        pointLight.intensity=4.0+Math.abs(tp1)*0.8;  // flickering light

    } else if(currentState==="SPEAKING"){
        // Smooth follower drives scale; volume gently modulates brightness
        const bs=updateBounce(dt);
        scaleTarget=bs;
        coreEmissive=0.62+currentVolume*0.20;         // was 0.35 multiplier
        midMat.opacity=0.20+currentVolume*0.10;       // was 0.20 multiplier
        outerMat.opacity=0.10+currentVolume*0.07;     // was 0.12 multiplier
        nodeMat.uniforms.uOpacity.value=0.78+currentVolume*0.18; // was 0.40
        pointLight.intensity=2.0+currentVolume*0.6;   // was 1.1 multiplier
        autoSpeeds.SPEAKING.y=0.0028+currentVolume*0.004;  // subtler speed ramp
        autoSpeeds.SPEAKING.x=0.0010+currentVolume*0.0015;

    } else { // LISTENING — receptive, alive: dual-wave breathing
        updateBounce(dt); // keep engine ticking to avoid scale pop on transition
        // Two overlapping sine waves → organic, not mechanical
        const w1=Math.sin(t*1.3), w2=Math.sin(t*2.9+0.8);
        const breathe=1.0 + w1*0.022 + w2*0.010;
        scaleTarget=breathe;
        // Core pulses between a warm base and a soft bright peak
        coreEmissive=0.58 + w1*0.12 + w2*0.04;
        // Layers undulate independently → layered depth feel
        midMat.opacity=0.22  + Math.sin(t*1.7+0.3)*0.06;
        outerMat.opacity=0.10 + Math.sin(t*2.1+1.1)*0.04;
        nodeMat.uniforms.uOpacity.value=0.86 + Math.sin(t*1.5)*0.10;
        pointLight.intensity=2.6 + Math.sin(t*1.8)*0.5;
    }

    // Unified smooth scale lerp — SPEAKING included (prevents snap artifacts)
    {
        const cs=group.scale.x;
        const lerpSpeed = currentState==="SPEAKING" ? 0.18 : 0.10;
        group.scale.setScalar(cs+(scaleTarget-cs)*lerpSpeed);
    }
    coreMat.emissiveIntensity=coreEmissive;

    // Ring spin intensity per state
    const im=(currentState==="MUTED")?0.25:(currentState==="THINKING")?2.5:(currentState==="SPEAKING")?1.6:1.2;
    ringMesh.rotation.z  +=0.005*im;
    ring2Mesh.rotation.z -=0.003*im;
    ring2Mesh.rotation.x +=0.0018*im;

    // Connection glow per state
    let lineOpacity = 0.12;
    if (currentState === "MUTED") {
        lineOpacity = 0.05;
    } else if (currentState === "THINKING") {
        lineOpacity = 0.22;
    } else if (currentState === "SPEAKING") {
        lineOpacity = 0.12 + currentVolume * 0.25;
    } else {
        lineOpacity = 0.14 + Math.sin(t * 1.5) * 0.04;
    }
    lineMat.opacity = Math.max(0.04, Math.min(0.5, lineOpacity));

    // Particles — LISTENING now fires like old SPEAKING
    if(currentState!=="MUTED"){
        const ch=(currentState==="THINKING")?0.40
                :(currentState==="SPEAKING")?0.60
                :(currentState==="LISTENING")?0.62  // same density as speaking
                :0.985;
        if(Math.random()>ch) createFloatingParticle();
    }
    // Ripples on THINKING
    if(currentState==="THINKING"&&Math.random()>0.97) triggerRipple();
    // Small ripple on speaking volume spike
    if(currentState==="SPEAKING"&&currentVolume>0.7&&Math.random()>0.97) triggerRipple();

    // Synaptic stats overlay (mirrors original per-frame update)
    const syncEl=document.getElementById('stat-sync');
    const loadEl=document.getElementById('stat-load');
    if(syncEl) syncEl.textContent=(currentState==="THINKING"?(99.4+Math.random()*0.5):(98.8+Math.random()*0.8)).toFixed(1)+'%';
    if(loadEl) loadEl.textContent=(currentState==="THINKING"?Math.floor(2+Math.random()*4):(currentState==="MUTED"?'0':Math.floor(6+Math.random()*7)))+' ms';

    renderer.render(scene,camera);
}
animate();

// ── Python API ────────────────────────────────────────────────────────────────
window.updateState=function(state){
    currentState=state;
    console.log("State:",state);
    switchPalette(state);
    bounceVel=0; bouncePos=1.0; prevVolume=0; // reset bounce on state switch

    if(state==="MUTED"){
        isMuted=true; baseIntensity=0.6;
        if(micBtn)    micBtn.classList.add('muted');
        if(micIconEl) micIconEl.textContent='mic_off';
        if(ring1El)   ring1El.style.opacity='0';
        if(ring2El)   ring2El.style.opacity='0';
        if(lblMutedEl){ lblMutedEl.style.opacity='1.0'; lblMutedEl.style.textShadow='0 0 12px rgba(255,51,85,0.8)'; }
        if(lblOnEl){    lblOnEl.style.opacity='0.35';   lblOnEl.style.textShadow='none'; }
    } else {
        isMuted=false; baseIntensity=(state==="SPEAKING")?1.2:1.0;
        if(micBtn)    micBtn.classList.remove('muted');
        if(micIconEl) micIconEl.textContent='mic';
        if(ring1El)   ring1El.style.opacity='1';
        if(ring2El)   ring2El.style.opacity='1';
        if(lblOnEl){    lblOnEl.style.opacity='1.0';    lblOnEl.style.textShadow=`0 0 12px ${hexToRgba(themeColors.PRI,0.6)}`; }
        if(lblMutedEl){ lblMutedEl.style.opacity='0.35'; lblMutedEl.style.textShadow='none'; }
    }

};

window.updateVolume=function(level){
    const clamped = Math.max(0, Math.min(1, level));
    // Asymmetric smoothing: rises slowly, falls slowly → no sudden jumps
    const alpha = clamped > smoothedVolume ? 0.06 : 0.04;
    smoothedVolume += (clamped - smoothedVolume) * alpha;
    currentVolume = smoothedVolume * 0.60;   // attenuate to 60% max influence
    if(currentState==="SPEAKING"&&!isMuted){
        if(ring1El) ring1El.style.transform=`scale(${1.0+currentVolume*0.3})`;
        if(ring2El) ring2El.style.transform=`scale(${1.0+currentVolume*0.15})`;
    } else {
        if(ring1El) ring1El.style.transform='none';
        if(ring2El) ring2El.style.transform='none';
    }
};

window.setThemeColors=function(colors){
    themeColors={
        PRI:colors.PRI||'#a855f7', PRI_DIM:colors.PRI_DIM||'#4c1d95',
        TEXT:colors.TEXT||'#e9d5ff', BG:colors.BG||'#07020f',
        ALT:colors.ALT||'#ec4899',
    };
    // Apply CSS variables (mirrors original behaviour)
    const root=document.documentElement;
    root.style.setProperty('--pri',       themeColors.PRI);
    root.style.setProperty('--pri-alt',   themeColors.ALT);
    root.style.setProperty('--glow',      hexToRgba(themeColors.PRI,0.38));
    root.style.setProperty('--glow2',     hexToRgba(themeColors.ALT,0.22));
    // Legacy variable names kept for Python compat
    root.style.setProperty('--primary-fixed',        themeColors.PRI);
    root.style.setProperty('--primary-fixed-dim',    themeColors.PRI_DIM);
    root.style.setProperty('--primary-glow',         hexToRgba(themeColors.PRI,0.4));
    root.style.setProperty('--primary-ring-1-bg',    hexToRgba(themeColors.PRI,0.2));
    root.style.setProperty('--primary-ring-2-bg',    hexToRgba(themeColors.PRI,0.15));
    root.style.setProperty('--capsule-bg',           hexToRgba(themeColors.BG,0.85));
    // Update stat overlay color
    const statsEl=document.getElementById('synaptic-stats');
    if(statsEl) statsEl.style.color=themeColors.PRI;
    // Update capsule border & label
    if(capsuleBorder) capsuleBorder.style.borderColor=hexToRgba(themeColors.PRI,0.3);
    if(lblOnEl){ lblOnEl.style.color=themeColors.PRI; if(!isMuted) lblOnEl.style.textShadow=`0 0 12px ${hexToRgba(themeColors.PRI,0.6)}`; }
    // Trigger 3D lerp transition
    targetPalette={...themeColors}; lerpT=0;
};

function onMicTriggerClick(){ if(pyBridge) pyBridge.toggle_mute(); }
function setMuteFromWeb(mute){ if(isMuted!==mute) onMicTriggerClick(); }

// ── Simulator helpers ─────────────────────────────────────────────────────────
function simState(state){ window.updateState(state); }
function simVolume(level){
    currentVolume=level;
    window.updateVolume(level);
}

// ─────────────────────────────────────────────────────────────────────────────
// MIC TEST — Web Audio API live microphone → drives volume + auto SPEAKING state
// ─────────────────────────────────────────────────────────────────────────────
let micStream=null, micCtx=null, micAnalyser=null, micAnimId=null;
let micActive=false;

async function toggleMicTest(){
    if(micActive){ stopMicTest(); return; }
    try {
        micStream=await navigator.mediaDevices.getUserMedia({audio:true,video:false});
        micCtx=new (window.AudioContext||window.webkitAudioContext)();
        const src=micCtx.createMediaStreamSource(micStream);
        micAnalyser=micCtx.createAnalyser();
        micAnalyser.fftSize=256; micAnalyser.smoothingTimeConstant=0.8;
        src.connect(micAnalyser);

        micActive=true;

        // Switch to LISTENING while mic is active (Python decides SPEAKING)
        // but we auto-switch to SPEAKING when volume rises
        const data=new Uint8Array(micAnalyser.frequencyBinCount);
        function tick(){
            micAnimId=requestAnimationFrame(tick);
            micAnalyser.getByteFrequencyData(data);
            let sum=0; for(let i=0;i<data.length;i++) sum+=data[i];
            const avg=sum/data.length;
            const level=Math.min(1.0, avg/80);

            // Auto state: loud = SPEAKING, quiet = LISTENING
            if(!isMuted){
                if(level>0.08 && currentState!=="SPEAKING"){
                    window.updateState("SPEAKING");
                } else if(level<=0.05 && currentState==="SPEAKING"){
                    window.updateState("LISTENING");
                }
            }
            window.updateVolume(level);
        }
        tick();
    } catch(e){
        console.error("Mic access denied:",e);
        alert("Microphone access denied or unavailable.");
    }
}

function stopMicTest(){
    micActive=false;
    if(micAnimId) cancelAnimationFrame(micAnimId);
    if(micStream) micStream.getTracks().forEach(t=>t.stop());
    if(micCtx) micCtx.close();
    micStream=micCtx=micAnalyser=null;
    currentVolume=0;
    if(currentState==="SPEAKING") window.updateState("LISTENING");
}

// ─────────────────────────────────────────────────────────────────────────────
// PLAY TEST — synthesized audio playback → drives SPEAKING bounce + state
// Plays a rich harmonic chord that pulses, simulating TTS output volume
// ─────────────────────────────────────────────────────────────────────────────
let playCtx=null, playNodes=[], playAnalyser=null, playAnimId=null;
let playActive=false;

function togglePlayTest(){
    if(playActive){ stopPlayTest(); return; }
    playActive=true;

    playCtx=new (window.AudioContext||window.webkitAudioContext)();
    playAnalyser=playCtx.createAnalyser();
    playAnalyser.fftSize=256; playAnalyser.smoothingTimeConstant=0.75;

    // Build a rich chord: root + 5th + octave + vibrato LFO
    const freqs=[220, 330, 440, 660];
    const gains=[0.28, 0.20, 0.16, 0.10];
    freqs.forEach((f,i)=>{
        const osc=playCtx.createOscillator();
        const gain=playCtx.createGain();
        const lfo=playCtx.createOscillator();
        const lfoGain=playCtx.createGain();

        osc.type=i%2===0?'sine':'triangle';
        osc.frequency.value=f;
        gain.gain.value=gains[i];

        lfo.frequency.value=4.5+i*0.8;  // vibrato rate
        lfoGain.gain.value=f*0.018;      // vibrato depth

        lfo.connect(lfoGain); lfoGain.connect(osc.frequency);
        osc.connect(gain); gain.connect(playAnalyser);
        lfo.start(); osc.start();
        playNodes.push(osc,gain,lfo,lfoGain);
    });

    // Master gain with slow amplitude modulation (breath rhythm)
    const master=playCtx.createGain();
    master.gain.value=0.7;
    playAnalyser.connect(master); master.connect(playCtx.destination);

    // Animate amplitude to mimic speaking rhythm
    let pt=0;
    function modulate(){
        if(!playActive) return;
        pt+=0.035;
        // Slow speech rhythm: ~1.2 Hz envelope
        const env=0.55+0.45*Math.abs(Math.sin(pt*1.2))*Math.abs(Math.sin(pt*3.7+1));
        master.gain.setTargetAtTime(env, playCtx.currentTime, 0.05);
        requestAnimationFrame(modulate);
    }
    modulate();
    playNodes.push(master);

    // Drive state + volume from analyser
    const data=new Uint8Array(playAnalyser.frequencyBinCount);
    function tick(){
        playAnimId=requestAnimationFrame(tick);
        playAnalyser.getByteFrequencyData(data);
        let sum=0; for(let i=0;i<data.length;i++) sum+=data[i];
        const level=Math.min(1.0,(sum/data.length)/55);

        if(!isMuted){
            if(level>0.05 && currentState!=="SPEAKING") window.updateState("SPEAKING");
        }
        window.updateVolume(level);
    }
    tick();
}

function stopPlayTest(){
    playActive=false;
    if(playAnimId) cancelAnimationFrame(playAnimId);
    playNodes.forEach(n=>{ try{ n.stop&&n.stop(); n.disconnect&&n.disconnect(); }catch(e){} });
    playNodes=[];
    if(playCtx){ playCtx.close(); playCtx=null; }
    currentVolume=0;
    if(currentState==="SPEAKING") window.updateState("LISTENING");
}
